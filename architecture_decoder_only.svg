<svg xmlns="http://www.w3.org/2000/svg" width="680" height="790" viewBox="0 0 680 790">
<style>
 text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
 .th{font-size:14px;font-weight:500}
 .ts{font-size:12px;font-weight:400}
 .arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
 .box{fill:#FFFFFF;stroke:#888780}
 .box-t{fill:#2C2C2A}.box-s{fill:#5F5E5A}
 .teal{fill:#E1F5EE;stroke:#0F6E56}.teal-t{fill:#085041}.teal-s{fill:#0F6E56}
 .purple{fill:#EEEDFE;stroke:#534AB7}.purple-t{fill:#3C3489}
 .amber{fill:#FAEEDA;stroke:#854F0B}.amber-t{fill:#633806}.amber-s{fill:#854F0B}
 rect{stroke-width:0.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="790" fill="#FFFFFF" stroke="none"/>
<rect class="box" x="240" y="40" width="200" height="44" rx="8"/><text class="th box-t" x="340" y="62" text-anchor="middle" dominant-baseline="central">User request</text>
<line x1="340" y1="86" x2="340" y2="106" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="240" y="114" width="200" height="44" rx="8"/><text class="th box-t" x="340" y="136" text-anchor="middle" dominant-baseline="central">Tokeniser</text>
<line x1="340" y1="160" x2="340" y2="176" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="240" y="178" width="200" height="56" rx="8"/><text class="th teal-t" x="340" y="198" text-anchor="middle" dominant-baseline="central">Token embedding</text><text class="ts teal-s" x="340" y="216" text-anchor="middle" dominant-baseline="central">RoPE inside attention</text>
<line x1="340" y1="236" x2="340" y2="254" class="arr" marker-end="url(#arrow)"/>
<rect class="purple" x="150" y="258" width="380" height="180" rx="20"/><text class="th purple-t" x="340" y="280" text-anchor="middle" dominant-baseline="central">x 8 identical blocks</text>
<rect class="teal" x="180" y="296" width="320" height="50" rx="8"/><text class="th teal-t" x="340" y="314" text-anchor="middle" dominant-baseline="central">Causal self-attention</text><text class="ts teal-s" x="340" y="332" text-anchor="middle" dominant-baseline="central">h = h + attn(norm(h))</text>
<line x1="340" y1="348" x2="340" y2="363" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="180" y="366" width="320" height="50" rx="8"/><text class="th teal-t" x="340" y="384" text-anchor="middle" dominant-baseline="central">SwiGLU feed-forward</text><text class="ts teal-s" x="340" y="402" text-anchor="middle" dominant-baseline="central">h = h + ffn(norm(h))</text>
<line x1="340" y1="440" x2="340" y2="460" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="240" y="462" width="200" height="44" rx="8"/><text class="th teal-t" x="340" y="484" text-anchor="middle" dominant-baseline="central">Final RMSNorm</text>
<line x1="340" y1="508" x2="340" y2="528" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="240" y="530" width="200" height="56" rx="8"/><text class="th teal-t" x="340" y="550" text-anchor="middle" dominant-baseline="central">Output projection</text><text class="ts teal-s" x="340" y="568" text-anchor="middle" dominant-baseline="central">to vocab logits, tied</text>
<line x1="340" y1="588" x2="340" y2="606" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="240" y="608" width="200" height="56" rx="8"/><text class="th teal-t" x="340" y="628" text-anchor="middle" dominant-baseline="central">Softmax + sampling</text><text class="ts teal-s" x="340" y="646" text-anchor="middle" dominant-baseline="central">top-k, temperature</text>
<line x1="340" y1="666" x2="340" y2="684" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="240" y="686" width="200" height="56" rx="8"/><text class="th box-t" x="340" y="706" text-anchor="middle" dominant-baseline="central">Spec, then code</text><text class="ts box-s" x="340" y="724" text-anchor="middle" dominant-baseline="central">both generated as tokens</text>
</svg>

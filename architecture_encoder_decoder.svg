<svg xmlns="http://www.w3.org/2000/svg" width="680" height="790" viewBox="0 0 680 790">
<style>
 text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
 .th{font-size:14px;font-weight:500}
 .ts{font-size:12px;font-weight:400}
 .arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
 .box{fill:#FFFFFF;stroke:#888780}
 .box-t{fill:#2C2C2A}.box-s{fill:#5F5E5A}
 .teal{fill:#E1F5EE;stroke:#0F6E56}.teal-t{fill:#085041}.teal-s{fill:#0F6E56}
 .purple{fill:#EEEDFE;stroke:#534AB7}.purple-t{fill:#3C3489}
 .amber{fill:#FAEEDA;stroke:#854F0B}.amber-t{fill:#633806}.amber-s{fill:#854F0B}
 rect{stroke-width:0.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="790" fill="#FFFFFF" stroke="none"/>
<rect class="box" x="50" y="40" width="240" height="44" rx="8"/><text class="th box-t" x="170" y="62" text-anchor="middle" dominant-baseline="central">User request</text>
<line x1="170" y1="86" x2="170" y2="110" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="50" y="114" width="240" height="44" rx="8"/><text class="th box-t" x="170" y="136" text-anchor="middle" dominant-baseline="central">Tokeniser</text>
<line x1="170" y1="160" x2="170" y2="174" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="50" y="178" width="240" height="56" rx="8"/><text class="th teal-t" x="170" y="198" text-anchor="middle" dominant-baseline="central">Token embedding</text><text class="ts teal-s" x="170" y="216" text-anchor="middle" dominant-baseline="central">RoPE inside attention</text>
<line x1="170" y1="236" x2="170" y2="254" class="arr" marker-end="url(#arrow)"/>
<rect class="purple" x="40" y="258" width="260" height="180" rx="20"/><text class="th purple-t" x="170" y="280" text-anchor="middle" dominant-baseline="central">x 4 encoder blocks</text>
<rect class="teal" x="60" y="296" width="220" height="50" rx="8"/><text class="th teal-t" x="170" y="314" text-anchor="middle" dominant-baseline="central">Self-attention</text><text class="ts teal-s" x="170" y="332" text-anchor="middle" dominant-baseline="central">no mask, bidirectional</text>
<line x1="170" y1="348" x2="170" y2="363" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="60" y="366" width="220" height="50" rx="8"/><text class="th teal-t" x="170" y="384" text-anchor="middle" dominant-baseline="central">SwiGLU feed-forward</text><text class="ts teal-s" x="170" y="402" text-anchor="middle" dominant-baseline="central">h = h + ffn(norm(h))</text>
<line x1="170" y1="440" x2="170" y2="458" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="50" y="462" width="240" height="44" rx="8"/><text class="th teal-t" x="170" y="484" text-anchor="middle" dominant-baseline="central">Final RMSNorm</text>
<line x1="170" y1="508" x2="170" y2="526" class="arr" marker-end="url(#arrow)"/>
<rect class="amber" x="50" y="530" width="240" height="56" rx="8"/><text class="th amber-t" x="170" y="550" text-anchor="middle" dominant-baseline="central">Encoder memory</text><text class="ts amber-s" x="170" y="568" text-anchor="middle" dominant-baseline="central">computed once, frozen</text>
<path d="M290 558 L330 558 L330 331 L386 331" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="390" y="40" width="230" height="56" rx="8"/><text class="th box-t" x="505" y="60" text-anchor="middle" dominant-baseline="central">Code so far</text><text class="ts box-s" x="505" y="78" text-anchor="middle" dominant-baseline="central">shifted right</text>
<line x1="505" y1="98" x2="505" y2="116" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="390" y="120" width="230" height="56" rx="8"/><text class="th teal-t" x="505" y="140" text-anchor="middle" dominant-baseline="central">Token embedding</text><text class="ts teal-s" x="505" y="158" text-anchor="middle" dominant-baseline="central">tied to projection</text>
<line x1="505" y1="178" x2="505" y2="196" class="arr" marker-end="url(#arrow)"/>
<rect class="purple" x="370" y="200" width="270" height="250" rx="20"/><text class="th purple-t" x="505" y="222" text-anchor="middle" dominant-baseline="central">x 8 decoder blocks</text>
<rect class="teal" x="390" y="238" width="230" height="50" rx="8"/><text class="th teal-t" x="505" y="256" text-anchor="middle" dominant-baseline="central">Causal self-attention</text><text class="ts teal-s" x="505" y="274" text-anchor="middle" dominant-baseline="central">masked</text>
<line x1="505" y1="290" x2="505" y2="303" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="390" y="306" width="230" height="50" rx="8"/><text class="th teal-t" x="505" y="324" text-anchor="middle" dominant-baseline="central">Cross-attention</text><text class="ts teal-s" x="505" y="342" text-anchor="middle" dominant-baseline="central">Q from decoder, K V above</text>
<line x1="505" y1="358" x2="505" y2="371" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="390" y="374" width="230" height="50" rx="8"/><text class="th teal-t" x="505" y="392" text-anchor="middle" dominant-baseline="central">SwiGLU feed-forward</text><text class="ts teal-s" x="505" y="410" text-anchor="middle" dominant-baseline="central">h = h + ffn(norm(h))</text>
<line x1="505" y1="452" x2="505" y2="468" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="390" y="472" width="230" height="44" rx="8"/><text class="th teal-t" x="505" y="494" text-anchor="middle" dominant-baseline="central">Final RMSNorm</text>
<line x1="505" y1="518" x2="505" y2="536" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="390" y="540" width="230" height="56" rx="8"/><text class="th teal-t" x="505" y="560" text-anchor="middle" dominant-baseline="central">Output projection</text><text class="ts teal-s" x="505" y="578" text-anchor="middle" dominant-baseline="central">to vocab logits</text>
<line x1="505" y1="598" x2="505" y2="616" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="390" y="620" width="230" height="56" rx="8"/><text class="th teal-t" x="505" y="640" text-anchor="middle" dominant-baseline="central">Softmax + sampling</text><text class="ts teal-s" x="505" y="658" text-anchor="middle" dominant-baseline="central">top-k, temperature</text>
<line x1="505" y1="678" x2="505" y2="696" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="390" y="700" width="230" height="56" rx="8"/><text class="th box-t" x="505" y="720" text-anchor="middle" dominant-baseline="central">Code</text><text class="ts box-s" x="505" y="738" text-anchor="middle" dominant-baseline="central">generated token by token</text>
</svg>
